[package]
name = "java_ide"
version = "0.3.0"
edition = "2024"
description = "A small, portable Java IDE written in Rust"

[[bin]]
name = "JavaIDE"
path = "src/main.rs"

[dependencies]
eframe = "0.36"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
trash = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
